[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outpour"
version = "2.1.1"
description = "Outpour, by Fanpost: schedule and cross-post long-form articles to Dev.to, Hashnode, Medium, Nostr, and more (fork of Crier)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alexander Richard Towell", email = "lex@metafunctor.com" }
]
keywords = ["cross-posting", "devto", "hashnode", "medium", "blogging", "content"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "pyyaml>=6.0",
    "rich>=13.0",
    "questionary>=2.0",
    "pyperclip>=1.8.0",
    "dateparser>=1.1.0",
    "feedgen>=1.0.0",
    "python-slugify>=8.0",
    "tree-sitter>=0.25,<0.27",
    "marko>=2.2.4,<3",
    "tree-sitter-html>=0.23.2,<0.24",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0,<2",
]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]
nostr = [
    "pynostr>=0.6",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
crier = "crier.cli:cli"
outpour = "crier.cli:cli"

[project.urls]
Homepage = "https://github.com/fanpost/outpour"
Repository = "https://github.com/fanpost/outpour"
Issues = "https://github.com/fanpost/outpour/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/crier"]

[tool.hatch.build.targets.wheel.force-include]
"src/crier/SKILL.md" = "crier/SKILL.md"

[tool.hatch.build.targets.sdist]
include = [
    "src/crier/**/*.py",
    "src/crier/SKILL.md",
    "src/crier/ui/static/**",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Explicit selection so lint results do not drift when ruff's default rule set
# changes between releases (ruff 0.17 widened its defaults to security, blind
# except, import order, and more). These are the rules the codebase is held to.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
